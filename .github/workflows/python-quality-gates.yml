name: Python quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - feat/generation-quality-gates

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
