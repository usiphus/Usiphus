name: Usiphus V11 checks

on:
  pull_request:
    paths:
      - "usiphus_v11.py"
      - "docs/V11_ADAPTIVE_LEARNING.md"
      - ".github/workflows/v11.yml"

jobs:
  v11-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile V11
        run: python -m py_compile usiphus_v11.py
      - name: Run V11 self-tests
        run: python usiphus_v11.py --self-test
