name: Feature request
description: Propose an improvement to Usiphus.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generator
        - Curriculum and coverage
        - Evidence governance
        - Faculty review
        - Release orchestration
        - Privacy and security
        - Documentation
        - Other
    validations:
      required: true
