[project]
name = "clinical-case-flashcards"
version = "8.2.0"
description = "Source-linked clinical case report harvesting and Anki conversion"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["history", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
